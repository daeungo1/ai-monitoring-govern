site_name: Azure OpenAI 모니터링 가이드
site_description: Azure OpenAI API 사용량·비용·가드레일 모니터링 방안과 실제 검증 데모
site_url: https://daeungo1.github.io/ai-monitoring-govern/
repo_url: https://github.com/daeungo1/ai-monitoring-govern
repo_name: daeungo1/ai-monitoring-govern
edit_uri: edit/main/
docs_dir: .site-src
site_dir: site
use_directory_urls: true

validation:
  links:
    anchors: warn

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 밝은 테마로 전환

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 개요:
      - 시작하기: index.md
      - 문서 지도: overview/documents.md
      - 공식 참고 자료: docs/references.md
  - 사용량·비용:
      - 1-1. 핵심 메트릭과 Alert: usage/metrics.md
      - 1-2. 실시간 비용·토큰: usage/cost.md
      - 1-3. 추가 운영 팁: usage/tips.md
      - 상세 자료:
          - 메트릭·토큰 비용 운영 가이드: docs/monitoring-guide.md
          - 공식 가격과 적용 범위: docs/pricing.md
          - 운영 가이드 전체와 실제 증거: AOAI_monitoring.md
  - 가드레일:
      - 2-1. 가드레일이란: guardrails/concept.md
      - 2-2. 효과적인 설정: guardrails/setup.md
      - 2-3. 차단 요청 조회: guardrails/blocked-requests.md
      - 상세 자료:
          - Content Safety 설정과 차단 관측: docs/content-safety.md
  - 화면·운영:
      - 화면 비교와 선택: ops/screens.md
      - 구성과 검증 범위: ops/architecture.md
      - 빠른 시작과 배포: ops/quickstart.md
      - 가격 갱신·설정·정리: ops/maintenance.md
      - 상세 자료:
          - Native 및 Hybrid 화면 상세: docs/dashboard.md
          - 표준 아키텍처와 보안 경계: docs/architecture.md
          - AI Observability Governance: docs/governance.md
          - Streaming 지표 정의: docs/streaming.md
          - 일일 보고서: dailyreport.md
          - 검증 결과와 미검증 범위: docs/validation.md
          - 이메일 알림 시나리오: docs/alert-email.md
          - 15분 고객 데모 Runbook: docs/demo-runbook.md
          - Hybrid 배포와 접근 상태: docs/hybrid-deployment.md
          - 참고 저장소 Dashboard: docs/reference-dashboard.md
          - AgentOps 적용 판단: docs/agentops-dashboard-mapping.md

copyright: Copyright &copy; Azure OpenAI 모니터링 가이드 contributors
